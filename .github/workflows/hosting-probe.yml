name: Check hosting connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify FTPS and public document root
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || '/public_html' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://ashkufaraz.ir/' }}
          CANDLE_PROXY_SUBSCRIPTION: ${{ secrets.CANDLE_PROXY_SUBSCRIPTION }}
        run: python3 deploy/candle_proxy.py
